[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = "0.3"

# libcosmic is not on crates.io; pin a git rev and bump it deliberately.
# rev 95236a944bfd51c63a2fc65fe50a592c47168d40 = master head on 2026-10-27
# ("feat: add cosmic-launch crate with systemd launch fixes (#1481)"),
# which pins the pop-os/iced submodule at 229186b5180b6217d93866c912e6373ac378b231.
# Feature set per PLAN.md: no default features (wayland/x11/dbus/a11y are
# Linux-only); `desktop`/`process` pull in Linux-only code (upstream #615).
# Builds on macOS without patches at this rev (Spike A).
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "95236a944bfd51c63a2fc65fe50a592c47168d40", default-features = false, features = [
    "winit",
    "tokio",
    "multi-window",
    "wgpu",
] }
